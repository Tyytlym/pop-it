<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>解压立体水晶泡泡</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background-color: #020105;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none;
  }
  canvas { display: block; }
  
  /* 底部控制面板 */
  .controls {
    position: absolute;
    bottom: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    background: rgba(20, 25, 40, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 24px;
    border-radius: 30px;
    border: 1px solid rgba(100, 200, 255, 0.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 10;
    max-width: calc(100% - 32px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  /* 按钮样式 */
  .btn-auto {
    background: transparent;
    border: 1px solid rgba(200, 230, 255, 0.3);
    color: rgba(200, 230, 255, 0.8);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 0.1em;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  .btn-auto.active {
    background: rgba(100, 200, 255, 0.2);
    border-color: rgba(100, 200, 255, 0.8);
    color: #fff;
    text-shadow: 0 0 10px rgba(100, 200, 255, 0.8);
  }

  /* 滑块样式 */
  .slider-container {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: rgba(200, 230, 255, 0.5);
    letter-spacing: 0.1em;
  }
  
  input[type=range] {
    -webkit-appearance: none;
    width: 100px;
    background: transparent;
  }
  input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 14px; width: 14px;
    border-radius: 50%;
    background: #fff;
    margin-top: -5px;
    box-shadow: 0 0 10px rgba(100, 200, 255, 0.8);
    cursor: pointer;
  }

  /* 主题选择器 */
  .theme-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-left: 14px;
    border-left: 1px solid rgba(100, 200, 255, 0.18);
  }
  .theme-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(200, 230, 255, 0.4);
    margin-right: 2px;
    white-space: nowrap;
  }
  .theme-btn {
    background: transparent;
    border: 1px solid rgba(200, 230, 255, 0.2);
    color: rgba(200, 230, 255, 0.55);
    padding: 6px 11px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 0.05em;
    transition: all 0.25s ease;
    white-space: nowrap;
    font-family: inherit;
  }
  .theme-btn:hover {
    border-color: rgba(200, 230, 255, 0.5);
    color: rgba(200, 230, 255, 0.9);
  }
  .theme-btn.active {
    background: rgba(100, 200, 255, 0.18);
    border-color: rgba(100, 200, 255, 0.75);
    color: #fff;
    box-shadow: 0 0 12px rgba(100, 200, 255, 0.35);
  }

  /* ===== 新增：右上角显隐切换按钮 ===== */
  .ui-toggle {
    position: absolute;
    top: 20px; right: 20px;
    width: 42px; height: 42px;
    padding: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 25, 40, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(100, 200, 255, 0.2);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    color: rgba(200, 230, 255, 0.75);
    cursor: pointer;
    z-index: 20;
    transition: opacity 0.35s ease, background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .ui-toggle:hover {
    background: rgba(40, 55, 85, 0.6);
    border-color: rgba(100, 200, 255, 0.6);
    color: #fff;
  }
  .ui-toggle svg { display: block; }

  /* 隐藏态 */
  body.ui-hidden .controls {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(20px);
  }
  body.ui-hidden .ui-toggle {
    opacity: 0.22;
  }
  body.ui-hidden .ui-toggle:hover {
    opacity: 1;
  }

  @media (max-width: 860px) {
    .controls {
      gap: 10px;
      padding: 10px 16px;
    }
    .theme-selector {
      border-left: none;
      padding-left: 0;
      border-top: 1px solid rgba(100, 200, 255, 0.18);
      padding-top: 10px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
  }
</style>
</head>
<body>

<button class="ui-toggle" id="uiToggle" title="隐藏面板 (H)"></button>

<div class="controls">
  <button class="btn-auto" id="btnAuto">开启自动解压</button>
  <div class="slider-container">
    <span>慢</span>
    <input type="range" id="speedSlider" min="100" max="2000" value="800" step="100" dir="rtl">
    <span>快</span>
  </div>
  <div class="theme-selector" id="themeSelector">
    <span class="theme-label">主题</span>
    <button class="theme-btn active" data-theme="crystal">水晶</button>
    <button class="theme-btn" data-theme="neon">霓虹</button>
    <button class="theme-btn" data-theme="sakura">樱花</button>
    <button class="theme-btn" data-theme="aurora">极光</button>
    <button class="theme-btn" data-theme="gold">金箔</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ==========================================
// 1. 音效 (增加参数控制音量，防炸音)
// ==========================================
let audioCtx;
function playSound(type, volume = 1.0) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  if (type === 'explode') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.6 * volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
  } else {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200 + Math.random() * 100, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.4 * volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
}

// ==========================================
// 2. 场景初始化
// ==========================================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 200);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

let visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
let visibleWidth = visibleHeight * camera.aspect;

const renderScene = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.5, 0.85);
bloomPass.threshold = 0.15; 
bloomPass.strength = 1.5;  
bloomPass.radius = 0.7;    

const composer = new EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

// ==========================================
// 3. 主题纹理绘制
// ==========================================

// —— 3.1 原始水晶（保持不变）——
function createCrystalTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const cx = 256, cy = 256, r = 240;

  ctx.clearRect(0, 0, 512, 512);
  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  baseGrad.addColorStop(0, 'rgba(200, 240, 255, 0)');
  baseGrad.addColorStop(0.8, 'rgba(200, 240, 255, 0.02)');
  baseGrad.addColorStop(1, 'rgba(200, 240, 255, 0.08)');
  ctx.fillStyle = baseGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 360; i += 15) {
    const angleStart = (i * Math.PI) / 180;
    const angleEnd = ((i + 15) * Math.PI) / 180;
    const dist = 0.7 + Math.sin(i * Math.PI / 180) * 0.2; 
    
    ctx.beginPath();
    ctx.arc(cx, cy, r * dist, angleStart, angleEnd);
    ctx.arc(cx, cy, r * 0.95, angleEnd, angleStart, true); 
    ctx.closePath();
    
    const hue = (i * 2) % 360;
    ctx.fillStyle = `hsla(${hue}, 100%, 70%, 0.15)`;
    ctx.fill();
  }

  const shadowGrad = ctx.createRadialGradient(cx, cy, r*0.85, cx, cy, r);
  shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
  shadowGrad.addColorStop(1, 'rgba(10, 20, 40, 0.4)'); 
  ctx.fillStyle = shadowGrad;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  ctx.globalCompositeOperation = 'screen';
  const bottomGlow = ctx.createRadialGradient(cx, cy + r*0.6, 0, cx, cy + r*0.6, r*0.5);
  bottomGlow.addColorStop(0, 'rgba(150, 220, 255, 0.4)');
  bottomGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = bottomGlow;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  const hl1 = ctx.createRadialGradient(cx - r*0.4, cy - r*0.4, 0, cx - r*0.4, cy - r*0.4, r*0.35);
  hl1.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
  hl1.addColorStop(0.15, 'rgba(255, 255, 255, 0.2)');
  hl1.addColorStop(1, 'rgba(255, 255, 255,0)');
  ctx.fillStyle = hl1;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  const hl2 = ctx.createRadialGradient(cx + r*0.5, cy - r*0.3, 0, cx + r*0.5, cy - r*0.3, r*0.3);
  hl2.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
  hl2.addColorStop(1, 'rgba(255, 255, 255,0)');
  ctx.fillStyle = hl2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0, Math.PI * 2); ctx.stroke();

  return new THREE.CanvasTexture(canvas);
}

// —— 3.2 霓虹 ——
function createNeonTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const cx = 256, cy = 256, r = 240;

  ctx.clearRect(0, 0, 512, 512);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();

  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  baseGrad.addColorStop(0, 'rgba(70, 15, 120, 0.85)');
  baseGrad.addColorStop(0.65, 'rgba(25, 0, 70, 0.6)');
  baseGrad.addColorStop(1, 'rgba(120, 20, 180, 0.45)');
  ctx.fillStyle = baseGrad;
  ctx.fillRect(0, 0, 512, 512);

  ctx.globalCompositeOperation = 'lighter';
  const rings = [
    { rr: r * 0.88, color: '#00ffff', w: 3 },
    { rr: r * 0.72, color: '#ff00ff', w: 2 },
    { rr: r * 0.56, color: '#00ffaa', w: 2.5 },
    { rr: r * 0.40, color: '#ffaa00', w: 2 },
    { rr: r * 0.24, color: '#ff0088', w: 2 },
  ];
  for (const ring of rings) {
    ctx.beginPath();
    ctx.arc(cx, cy, ring.rr, 0, Math.PI * 2);
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = ring.w;
    ctx.shadowColor = ring.color;
    ctx.shadowBlur = 22;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  const centerGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.35);
  centerGlow.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
  centerGlow.addColorStop(0.4, 'rgba(200, 0, 255, 0.3)');
  centerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = centerGlow;
  ctx.fillRect(0, 0, 512, 512);

  ctx.restore();

  ctx.globalCompositeOperation = 'destination-in';
  const mask = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r);
  mask.addColorStop(0, 'rgba(255,255,255,1)');
  mask.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = mask;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  return new THREE.CanvasTexture(canvas);
}

// —— 3.3 樱花（重做：深底 + 高对比花瓣）——
function createSakuraTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const cx = 256, cy = 256, r = 240;

  ctx.clearRect(0, 0, 512, 512);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();

  // 深酒红半透明底：给花瓣提供暗背景，同时保持泡泡通透感
  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  baseGrad.addColorStop(0,   'rgba(70, 18, 44, 0.42)');
  baseGrad.addColorStop(0.65,'rgba(48, 10, 32, 0.36)');
  baseGrad.addColorStop(1,   'rgba(92, 24, 56, 0.30)');
  ctx.fillStyle = baseGrad;
  ctx.fillRect(0, 0, 512, 512);

  // 花瓣：source-over 逐朵绘制，内浅外深 + 细描边，轮廓清晰
  for (let i = 0; i < 38; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.sqrt(Math.random()) * r * 0.85;
    const px = cx + Math.cos(angle) * dist;
    const py = cy + Math.sin(angle) * dist;
    const pw = 8 + Math.random() * 13;
    const ph = pw * (0.42 + Math.random() * 0.25);
    const rot = Math.random() * Math.PI;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(rot);

    const petalGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, pw);
    petalGrad.addColorStop(0,    'rgba(255, 215, 232, 0.95)');
    petalGrad.addColorStop(0.55, 'rgba(255, 128, 178, 0.82)');
    petalGrad.addColorStop(1,    'rgba(205, 55, 125, 0.50)');
    ctx.fillStyle = petalGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, pw, ph, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 195, 220, 0.30)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.restore();
  }

  // 微弱中心光：不再抢对比度
  const center = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.32);
  center.addColorStop(0, 'rgba(255, 225, 240, 0.16)');
  center.addColorStop(1, 'rgba(255, 225, 240, 0)');
  ctx.fillStyle = center;
  ctx.fillRect(0, 0, 512, 512);

  ctx.restore();

  // 柔和边缘
  ctx.globalCompositeOperation = 'destination-in';
  const mask = ctx.createRadialGradient(cx, cy, r * 0.88, cx, cy, r);
  mask.addColorStop(0, 'rgba(255,255,255,1)');
  mask.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = mask;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = 'rgba(255, 170, 200, 0.45)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.stroke();

  return new THREE.CanvasTexture(canvas);
}

// —— 3.4 极光 ——
function createAuroraTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const cx = 256, cy = 256, r = 240;

  ctx.clearRect(0, 0, 512, 512);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();

  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  baseGrad.addColorStop(0, 'rgba(0, 45, 65, 0.7)');
  baseGrad.addColorStop(0.7, 'rgba(0, 20, 50, 0.55)');
  baseGrad.addColorStop(1, 'rgba(0, 60, 80, 0.45)');
  ctx.fillStyle = baseGrad;
  ctx.fillRect(0, 0, 512, 512);

  ctx.globalCompositeOperation = 'lighter';
  const bands = [
    { y: cy - r * 0.55, h: r * 0.35, color: [0, 160, 255], amp: 14, freq: 0.018, phase: 1.2, alpha: 0.35 },
    { y: cy - r * 0.25, h: r * 0.55, color: [0, 255, 170], amp: 20, freq: 0.022, phase: 0.0, alpha: 0.55 },
    { y: cy + r * 0.10, h: r * 0.55, color: [0, 210, 255], amp: 18, freq: 0.020, phase: 2.4, alpha: 0.50 },
    { y: cy + r * 0.45, h: r * 0.40, color: [170, 90, 255], amp: 16, freq: 0.024, phase: 3.6, alpha: 0.45 },
  ];
  for (const band of bands) {
    const grad = ctx.createLinearGradient(0, band.y - band.h / 2, 0, band.y + band.h / 2);
    grad.addColorStop(0, `rgba(${band.color[0]}, ${band.color[1]}, ${band.color[2]}, 0)`);
    grad.addColorStop(0.5, `rgba(${band.color[0]}, ${band.color[1]}, ${band.color[2]}, ${band.alpha})`);
    grad.addColorStop(1, `rgba(${band.color[0]}, ${band.color[1]}, ${band.color[2]}, 0)`);
    ctx.fillStyle = grad;

    ctx.beginPath();
    for (let x = 0; x <= 512; x += 6) {
      ctx.lineTo(x, band.y + Math.sin(x * band.freq + band.phase) * band.amp);
    }
    for (let x = 512; x >= 0; x -= 6) {
      ctx.lineTo(x, band.y + band.h + Math.sin(x * band.freq + band.phase) * band.amp);
    }
    ctx.closePath();
    ctx.fill();
  }

  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.35);
  core.addColorStop(0, 'rgba(200, 255, 255, 0.45)');
  core.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = core;
  ctx.fillRect(0, 0, 512, 512);

  ctx.restore();

  ctx.globalCompositeOperation = 'destination-in';
  const mask = ctx.createRadialGradient(cx, cy, r * 0.88, cx, cy, r);
  mask.addColorStop(0, 'rgba(255,255,255,1)');
  mask.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = mask;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = 'rgba(180, 255, 245, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.stroke();

  return new THREE.CanvasTexture(canvas);
}

// —— 3.5 金箔 ——
function createGoldTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const cx = 256, cy = 256, r = 240;

  ctx.clearRect(0, 0, 512, 512);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();

  const baseGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  baseGrad.addColorStop(0, 'rgba(120, 80, 20, 0.7)');
  baseGrad.addColorStop(0.65, 'rgba(80, 50, 10, 0.55)');
  baseGrad.addColorStop(1, 'rgba(160, 110, 30, 0.45)');
  ctx.fillStyle = baseGrad;
  ctx.fillRect(0, 0, 512, 512);

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 240; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.sqrt(Math.random()) * r * 0.9;
    const px = cx + Math.cos(angle) * dist;
    const py = cy + Math.sin(angle) * dist;
    const size = Math.random() * 2.4 + 0.6;
    const g = ctx.createRadialGradient(px, py, 0, px, py, size * 2.2);
    g.addColorStop(0, 'rgba(255, 240, 170, 0.95)');
    g.addColorStop(0.4, 'rgba(255, 205, 90, 0.5)');
    g.addColorStop(1, 'rgba(255, 180, 60, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(px, py, size * 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  const center = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 0.45);
  center.addColorStop(0, 'rgba(255, 240, 180, 0.55)');
  center.addColorStop(0.5, 'rgba(255, 200, 80, 0.22)');
  center.addColorStop(1, 'rgba(255, 180, 60, 0)');
  ctx.fillStyle = center;
  ctx.fillRect(0, 0, 512, 512);

  ctx.restore();

  ctx.globalCompositeOperation = 'destination-in';
  const mask = ctx.createRadialGradient(cx, cy, r * 0.88, cx, cy, r);
  mask.addColorStop(0, 'rgba(255,255,255,1)');
  mask.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = mask;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.strokeStyle = 'rgba(255, 220, 140, 0.65)';
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.stroke();

  return new THREE.CanvasTexture(canvas);
}

// —— 3.6 主题注册表 ——
const themeTextures = {
  crystal: createCrystalTexture(),
  neon:    createNeonTexture(),
  sakura:  createSakuraTexture(),
  aurora:  createAuroraTexture(),
  gold:    createGoldTexture(),
};

const bubbleMaterial = new THREE.SpriteMaterial({
  map: themeTextures.crystal,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

// ==========================================
// 4. 泡泡生成
// ==========================================
const bubbles = [];
const BUBBLE_COUNT = 15;

class Bubble {
  constructor() {
    const scale = Math.random() * 19 + 26; 
    this.mesh = new THREE.Sprite(bubbleMaterial.clone());
    this.mesh.scale.set(scale, scale, 1);
    this.scaleBase = scale;
    
    this.radius = scale * 0.45 * 2.2;
    
    this.mesh.position.set(
      (Math.random() - 0.5) * visibleWidth * 0.8,
      (Math.random() - 0.5) * visibleHeight * 0.8,
      (Math.random() - 0.5) * 50
    );

    this.speedX = (Math.random() - 0.5) * 0.3;
    this.speedY = (Math.random() - 0.5) * 0.3;
    this.isDead = false;
    this.phase = Math.random() * Math.PI * 2;
    this.mesh.material.opacity = 0;
    
    this.type = Math.random() > 0.5 ? 'explode' : 'liquid';
    this.hue = Math.random();
    this.mesh.material.color.setHSL(this.hue, 0.9, 0.75); 
    this.mesh.material.rotation = Math.random() * Math.PI * 2;
  }

  update(time) {
    if (this.isDead) return;

    if (this.mesh.material.opacity < 0.85) {
      this.mesh.material.opacity += 0.02;
    }

    this.mesh.position.x += this.speedX;
    this.mesh.position.y += this.speedY;

    const boundX = visibleWidth * 0.45;
    const boundY = visibleHeight * 0.45;
    
    if (this.mesh.position.x > boundX || this.mesh.position.x < -boundX) this.speedX *= -1;
    if (this.mesh.position.y > boundY || this.mesh.position.y < -boundY) this.speedY *= -1;

    const s = this.scaleBase * (1 + Math.sin(time * 2 + this.phase) * 0.05);
    this.mesh.scale.set(s, s, 1);
    this.radius = s * 0.45 * 2.2;
  }
}

for (let i = 0; i < BUBBLE_COUNT; i++) {
  const b = new Bubble();
  bubbles.push(b);
  scene.add(b.mesh);
}

// ==========================================
// 5. 极高浓度粒子系统（完全不变）
// ==========================================
const PARTICLE_POOL_SIZE = 60000;
const particles = [];
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_POOL_SIZE * 3);
const colors = new Float32Array(PARTICLE_POOL_SIZE * 3);
const sizes = new Float32Array(PARTICLE_POOL_SIZE);
const lifetimes = new Float32Array(PARTICLE_POOL_SIZE);

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('customColor', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geometry.setAttribute('aLife', new THREE.BufferAttribute(lifetimes, 1));

const vertexShader = `
  attribute float size;
  attribute vec3 customColor;
  attribute float aLife;
  varying vec3 vColor;
  varying float vLife;
  void main() {
    vColor = customColor;
    vLife = aLife;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (300.0 / -mvPosition.z) * aLife;
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const fragmentShader = `
  varying vec3 vColor;
  varying float vLife;
  void main() {
    if (vLife <= 0.0) discard;
    float dist = length(gl_PointCoord - vec2(0.5));
    if (dist > 0.5) discard;
    float alpha = smoothstep(0.5, 0.0, dist) * vLife;
    vec3 finalColor = vColor * (1.0 + pow(alpha, 3.0) * 1.5);
    gl_FragColor = vec4(finalColor, alpha);
  }
`;

const particleMaterial = new THREE.ShaderMaterial({
  vertexShader: vertexShader,
  fragmentShader: fragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const particleSystem = new THREE.Points(geometry, particleMaterial);
scene.add(particleSystem);

let ptr = 0;
for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
  particles.push({
    active: false, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
    life: 0, maxLife: 1, color: new THREE.Color(), size: 0, type: 'explode'
  });
}

function spawnParticles(pos, baseHue, type) {
  let count = type === 'explode' ? 1500 : 1800;
  
  for (let i = 0; i < count; i++) {
    let p = null;
    let attempts = 0;
    while (attempts < PARTICLE_POOL_SIZE) {
      p = particles[ptr];
      ptr = (ptr + 1) % PARTICLE_POOL_SIZE;
      if (!p.active) break;
      attempts++;
    }
    if (attempts >= PARTICLE_POOL_SIZE) break;

    p.active = true;
    p.x = pos.x + (Math.random() - 0.5) * 20;
    p.y = pos.y + (Math.random() - 0.5) * 20;
    p.z = pos.z;
    p.type = type;

    if (type === 'explode') {
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      const speed = Math.random() * 6 + 2; 

      p.vx = Math.sin(phi) * Math.cos(theta) * speed;
      p.vy = Math.sin(phi) * Math.sin(theta) * speed;
      p.vz = Math.cos(phi) * speed;

      p.life = 1.0;
      p.maxLife = 1.5 + Math.random() * 1.0;
      p.color.setHSL((baseHue + Math.random() * 0.3) % 1, 1.0, 0.7);
      p.size = Math.random() * 4.5 + 2.5;
    } else {
      const theta = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;

      p.vx = Math.cos(theta) * speed * 0.5;
      p.vy = Math.sin(theta) * speed * 0.5 - (Math.random() * 2 + 1); 
      p.vz = (Math.random() - 0.5) * 1;

      p.life = 1.0;
      p.maxLife = 2.0 + Math.random() * 1.5;
      p.color.setHSL((baseHue + Math.random() * 0.4) % 1, 1.0, 0.65);
      p.size = Math.random() * 5 + 3; 
    }
  }
}

// ==========================================
// 6. 引爆逻辑（完全不变）
// ==========================================
function popBubble(b, volume = 1.0) {
  if (b.isDead) return;
  
  playSound(b.type, volume);
  spawnParticles(b.mesh.position, b.hue, b.type);
  
  b.isDead = true;
  b.mesh.material.opacity = 0;
  
  setTimeout(() => {
    b.isDead = false;
    b.mesh.position.set(
      (Math.random() - 0.5) * visibleWidth * 0.8,
      (Math.random() - 0.5) * visibleHeight * 0.8,
      (Math.random() - 0.5) * 50
    );
    b.speedX = (Math.random() - 0.5) * 0.3;
    b.speedY = (Math.random() - 0.5) * 0.3;
    b.type = Math.random() > 0.5 ? 'explode' : 'liquid';
    b.hue = Math.random();
    b.mesh.material.color.setHSL(b.hue, 0.9, 0.75); 
    b.mesh.material.rotation = Math.random() * Math.PI * 2;
  }, 400);
}

// ==========================================
// 7. 自动解压逻辑（完全不变）
// ==========================================
let autoMode = false;
let autoInterval = 800;
let autoTimer = 0;

const btnAuto = document.getElementById('btnAuto');
const speedSlider = document.getElementById('speedSlider');

btnAuto.addEventListener('click', () => {
  autoMode = !autoMode;
  if (autoMode) {
    btnAuto.textContent = '停止自动解压';
    btnAuto.classList.add('active');
    autoTimer = autoInterval;
  } else {
    btnAuto.textContent = '开启自动解压';
    btnAuto.classList.remove('active');
  }
});

speedSlider.addEventListener('input', (e) => {
  autoInterval = parseInt(e.target.value);
});

// ==========================================
// 8. 主题切换（完全不变）
// ==========================================
let currentTheme = 'crystal';

function applyTheme(name) {
  if (!themeTextures[name]) return;
  currentTheme = name;
  for (const b of bubbles) {
    b.mesh.material.map = themeTextures[name];
    b.mesh.material.needsUpdate = true;
  }
}

const themeSelector = document.getElementById('themeSelector');
themeSelector.addEventListener('click', (e) => {
  const btn = e.target.closest('.theme-btn');
  if (!btn) return;
  const theme = btn.dataset.theme;
  if (theme === currentTheme) return;
  themeSelector.querySelectorAll('.theme-btn').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  applyTheme(theme);
});

// ==========================================
// 9. 新增：UI 显隐切换
// ==========================================
const uiToggle = document.getElementById('uiToggle');

const ICON_HIDE = `
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94
             M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19
             m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
    <line x1="1" y1="1" x2="23" y2="23"></line>
  </svg>`;

const ICON_SHOW = `
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </svg>`;

let uiVisible = true;

function setUIVisible(visible) {
  uiVisible = visible;
  document.body.classList.toggle('ui-hidden', !visible);
  uiToggle.innerHTML = visible ? ICON_HIDE : ICON_SHOW;
  uiToggle.title = visible ? '隐藏面板 (H)' : '显示面板 (H)';
}

// 初始图标
setUIVisible(true);

uiToggle.addEventListener('click', () => setUIVisible(!uiVisible));

window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') {
    setUIVisible(!uiVisible);
  }
});

// ==========================================
// 10. 交互逻辑（新增：UI 区域不误触爆破）
// ==========================================
const mouseVec = new THREE.Vector2(-10, -10);
const v3 = new THREE.Vector3(); 
let isPointerDown = false;

function checkHit() {
  if (mouseVec.x === -10) return;

  for (let b of bubbles) {
    if (b.isDead) continue;

    v3.copy(b.mesh.position);
    v3.project(camera);

    const screenX = (v3.x * 0.5 + 0.5) * window.innerWidth;
    const screenY = (-v3.y * 0.5 + 0.5) * window.innerHeight;

    const dx = mouseVec.x - screenX;
    const dy = mouseVec.y - screenY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist < b.radius) {
      popBubble(b, 1.0);
      break; 
    }
  }
}

window.addEventListener('pointerdown', (e) => {
  // 点在 UI 上时不触发泡泡爆破
  if (e.target.closest('.controls') || e.target.closest('.ui-toggle')) return;

  isPointerDown = true;
  mouseVec.x = e.clientX;
  mouseVec.y = e.clientY;
  checkHit();
});

window.addEventListener('pointermove', (e) => {
  mouseVec.x = e.clientX;
  mouseVec.y = e.clientY;
  if (isPointerDown) checkHit(); 
});

window.addEventListener('pointerup', () => isPointerDown = false);

// ==========================================
// 11. 主循环（完全不变）
// ==========================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const time = clock.getElapsedTime();

  for (let b of bubbles) b.update(time);

  if (autoMode) {
    autoTimer += dt * 1000;
    if (autoTimer >= autoInterval) {
      autoTimer = 0;
      const aliveBubbles = bubbles.filter(b => !b.isDead);
      if (aliveBubbles.length > 0) {
        const randomBubble = aliveBubbles[Math.floor(Math.random() * aliveBubbles.length)];
        popBubble(randomBubble, 0.4); 
      }
    }
  }

  const posAttr = geometry.attributes.position;
  const colorAttr = geometry.attributes.customColor;
  const sizeAttr = geometry.attributes.size;
  const lifeAttr = geometry.attributes.aLife;

  for (let i = 0; i < PARTICLE_POOL_SIZE; i++) {
    const p = particles[i];
    if (!p.active) {
      if (lifeAttr.getX(i) !== 0) lifeAttr.setX(i, 0);
      continue;
    }

    p.life -= dt / p.maxLife;
    if (p.life <= 0) {
      p.active = false;
      lifeAttr.setX(i, 0);
      continue;
    }

    if (p.type === 'explode') {
      p.vx *= 0.90;
      p.vy *= 0.90;
      p.vz *= 0.90;
      p.vy += dt * 0.5;
      p.vx += (Math.random() - 0.5) * 0.2;
      p.vy += (Math.random() - 0.5) * 0.2;
    } else {
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.vz *= 0.96;
      p.vy -= dt * 8.0; 
      p.vx += Math.sin(time * 5 + p.x) * 0.05;
    }

    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;
    p.z += p.vz * dt * 60;

    posAttr.setXYZ(i, p.x, p.y, p.z);
    
    const c = p.color.clone().multiplyScalar(Math.min(1, p.life * 2));
    colorAttr.setXYZ(i, c.r, c.g, c.b);
    
    if (p.type === 'liquid') {
      sizeAttr.setX(i, p.size * (1 + (1 - p.life) * 1.0));
    } else {
      sizeAttr.setX(i, p.size);
    }
    
    lifeAttr.setX(i, p.life);
  }

  posAttr.needsUpdate = true;
  colorAttr.needsUpdate = true;
  sizeAttr.needsUpdate = true;
  lifeAttr.needsUpdate = true;

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  
  visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
  visibleWidth = visibleHeight * camera.aspect;
});

animate();
</script>
